packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

# Build scripts are denied by default and allowed one at a time, deliberately:
# an install script runs arbitrary code with the developer's environment in
# scope, so each entry here is a decision rather than a convenience.
#
#   esbuild            — platform-specific binary; vitest cannot run without it.
#   prisma / @prisma/* — the query engine is a native binary fetched at install
#                        and regenerated by `prisma generate`. @convoy/db cannot
#                        build, migrate or seed without it (CVY-005).
#
# Nothing else is permitted.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
