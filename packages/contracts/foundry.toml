[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
# Reverts are a product feature: they are what `simulate:true` decodes into
# `revertReason` for the Critic. Custom errors only, no require strings.

# Write access for exactly one directory, the payloadHash parity fixtures
# (CVY-002). They are dumped by script/DumpPayloadHashFixtures.s.sol rather than
# hand-written, so the TypeScript side is checked against real Solidity output.
# Scoped deliberately: no other path is writable.
fs_permissions = [{ access = "write", path = "../../tests/fixtures" }]

[profile.default.fuzz]
runs = 256

[invariant]
runs = 1000
depth = 32
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Basescan verification uses the single Etherscan API V2 key; legacy per-chain
# V1 endpoints were deprecated 2025-08-15 and are no longer accepted.
[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
