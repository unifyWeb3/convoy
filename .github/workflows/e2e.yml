name: E2E

# Playwright runs against a real Vercel preview deployment, so it is triggered
# by deployment status rather than by push. The web app deploys through Vercel's
# git integration only — never the CLI.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to run the E2E suite against'
        required: true

jobs:
  playwright:
    name: Playwright demo E2E
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve target URL
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.base_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ github.event.deployment_status.environment_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run E2E
        env:
          CONVOY_E2E_BASE_URL: ${{ steps.target.outputs.url }}
        run: |
          if ! ls apps/web/e2e/*.spec.ts >/dev/null 2>&1; then
            echo "No Playwright specs yet (demo.spec.ts lands in CVY-009/CVY-019)."
            exit 0
          fi
          pnpm --filter @convoy/web exec playwright install --with-deps chromium
          pnpm --filter @convoy/web exec playwright test

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
